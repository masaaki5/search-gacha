<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検索ガチャ</title>

<style>
body {
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
    padding: 80px 20px;
}

h1 {
    font-size: 48px;
}

#result {
    background: #222;
    border: 4px solid #555;
    border-radius: 30px;
    padding: 100px 20px;
    margin: 60px auto;
    max-width: 900px;
}

#topic {
    font-size: 56px;
    font-weight: bold;
    margin-bottom: 30px;
}

#rarity {
    font-size: 44px;
}

button {
    font-size: 40px;
    padding: 30px 60px;
    margin: 20px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

#gachaButton {
    background: #555;
    color: white;
}

#searchButton {
    background: #4285f4;
    color: white;
}

/* レアリティの色 */
.N {
    color: white;
}

.R {
    color: #4285f4;
}

.SR {
    color: red;
}

.SSR {
    color: silver;
}

.UR {
    color: gold;
}


/* =========================
   スマホ用
   ========================= */

@media (max-width: 600px) {

    body {
        padding: 20px 8px;
    }

    h1 {
        font-size: 21px;
    }

    #result {
        padding: 39px 10px;
        margin: 20px auto;
        border-radius: 13px;
        border-width: 3px;
    }

    #topic {
        font-size: 21px;
        margin-bottom: 13px;
    }

    #rarity {
        font-size: 18px;
    }

    button {
        font-size: 16px;
        padding: 12px 20px;
        margin: 7px;
        border-radius: 10px;
    }
}

</style>
</head>

<body>

<h1>🎰 検索ガチャ</h1>

<div id="result">
    <div id="topic">？？？</div>
    <div id="rarity">---</div>
</div>

<button id="gachaButton" onclick="gacha()">🎲 ガチャを回す</button>

<br>

<button id="searchButton" onclick="searchGoogle()">🔎 Googleで検索</button>


<script>

/* =========================
   お題300個
   ========================= */

const categories = [
    "身近な科学",
    "宇宙",
    "動物",
    "植物",
    "食べ物",
    "人体",
    "心理学",
    "歴史",
    "地理",
    "日本",
    "世界",
    "文化",
    "音楽",
    "映画",
    "ゲーム",
    "スポーツ",
    "サッカー",
    "テクノロジー",
    "インターネット",
    "乗り物",
    "建物",
    "仕事",
    "お金",
    "生活",
    "料理",
    "言葉",
    "雑学",
    "不思議",
    "未来",
    "ランキング"
];

const subjects = [
    "意外な事実",
    "知られざる歴史",
    "面白い仕組み",
    "驚きの違い",
    "意外な共通点",
    "世界の珍しい例",
    "昔と今の違い",
    "最も○○なもの",
    "身近だけど知らないこと",
    "検索すると面白いもの"
];


/* 30カテゴリー × 10テーマ = 300個 */

let topicTexts = [];

for (let i = 0; i < categories.length; i++) {

    for (let j = 0; j < subjects.length; j++) {

        topicTexts.push(
            categories[i] + "の" + subjects[j]
        );

    }
}


/* =========================
   レアリティ設定
   ========================= */

const rarities = [];

/*
N   180個
R    75個
SR   30個
SSR  12個
UR    3個

合計300個
*/

for (let i = 0; i < 180; i++) {
    rarities.push("N");
}

for (let i = 0; i < 75; i++) {
    rarities.push("R");
}

for (let i = 0; i < 30; i++) {
    rarities.push("SR");
}

for (let i = 0; i < 12; i++) {
    rarities.push("SSR");
}

for (let i = 0; i < 3; i++) {
    rarities.push("UR");
}


/* =========================
   お題データ作成
   ========================= */

const topics = topicTexts.map(function(text, index) {

    return {
        text: text,
        rarity: rarities[index]
    };

});


let currentTopic = null;
let lastTopic = null;


/* =========================
   レアリティ抽選
   ========================= */

function getRarity() {

    const r = Math.random() * 100;

    if (r < 60) {
        return "N";
    }

    if (r < 85) {
        return "R";
    }

    if (r < 95) {
        return "SR";
    }

    if (r < 99) {
        return "SSR";
    }

    return "UR";
}


/* =========================
   ガチャ
   ========================= */

function gacha() {

    const rarity = getRarity();

    let candidates = topics.filter(function(topic) {

        return topic.rarity === rarity;

    });


    /* 前回と同じお題を避ける */

    let availableCandidates =
        candidates.filter(function(topic) {

            return topic.text !== lastTopic;

        });


    if (availableCandidates.length === 0) {

        availableCandidates = candidates;

    }


    const selected =
        availableCandidates[
            Math.floor(
                Math.random() *
                availableCandidates.length
            )
        ];


    currentTopic = selected;
    lastTopic = selected.text;


    /* お題表示 */

    document.getElementById("topic").textContent =
        selected.text;


    /* レアリティ表示 */

    const rarityElement =
        document.getElementById("rarity");


    rarityElement.textContent =
        "【" + selected.rarity + "】";


    rarityElement.className =
        selected.rarity;

}


/* =========================
   Google検索
   ========================= */

function searchGoogle() {

    if (currentTopic === null) {

        alert("先にガチャを回してください！");

        return;
    }


    const query =
        encodeURIComponent(currentTopic.text);


    window.open(
        "https://www.google.com/search?q=" + query,
        "_blank"
    );

}

</script>

</body>
</html>
