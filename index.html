<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>🎰 ランダム検索</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
}

body {
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
    padding: 0 10px 40px;
    box-sizing: border-box;
}


/* =========================
   上部スワイプ説明
========================= */

#topSwipeText {
    font-size: 16px;
    color: white;
    opacity: 0.45;

    padding-top: 18px;
    margin-bottom: 25px;
}


/* =========================
   タイトル
========================= */

h1 {
    font-size: 36px;
    margin: 0 0 30px;
}


/* =========================
   検索ワード
========================= */

#result {
    position: relative;

    background: #222;
    border: 3px solid #555;
    border-radius: 20px;

    height: 180px;

    padding: 30px 45px 30px 15px;

    margin: 30px auto;

    max-width: 900px;

    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    touch-action: manipulation;
}


#topic {
    font-size: 30px;
    font-weight: bold;
    line-height: 1.5;
    width: 100%;
}


/* =========================
   外部リンクマーク
========================= */

#externalIcon {
    position: absolute;

    right: 12px;
    bottom: 8px;

    font-size: 22px;

    color: white;
    opacity: 0.55;

    pointer-events: none;
}


/* =========================
   リロードボタン
========================= */

#reloadButton {
    width: 160px;
    height: 55px;

    font-size: 20px;

    color: white;
    background: #333;

    border: 2px solid #666;
    border-radius: 14px;

    cursor: pointer;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   長押し説明
========================= */

#longPressText {
    font-size: 16px;

    color: white;

    opacity: 0.45;

    margin-top: 20px;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    touch-action: manipulation;

    cursor: pointer;
}


/* =========================
   スマホ
========================= */

@media screen and (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    #result {
        height: 170px;

        padding: 25px 42px 25px 12px;

        margin: 25px auto;
    }

    #topic {
        font-size: 26px;
    }

    #topSwipeText,
    #longPressText {
        font-size: 16px;
    }

}

</style>
</head>


<body>


<!-- =========================
     上部
========================= -->

<div id="topSwipeText">
    ⇩ 下にスワイプしてリロード
</div>


<!-- =========================
     タイトル
========================= -->

<h1>
    🎰 ランダム検索
</h1>


<!-- =========================
     検索ワード
========================= -->

<div id="result">

    <div id="topic">
        ？？？
    </div>

    <div id="externalIcon">
        ↗
    </div>

</div>


<!-- =========================
     リロードボタン
========================= -->

<button id="reloadButton">
    🔄 リロード
</button>


<!-- =========================
     長押し説明
========================= -->

<div id="longPressText">
    🔄 リロード長押しでランダム

    "不思議",
    "未来",
    "ランキング"

];


const subjects = [

    "意外な事実",

];


let topics = [];


for (

    i < categories.length;
    i++
) {

    for (
        let j = 0;
        j < subjects.length;
        j++
    ) {

        topics.push(

        );

    "変わった形の家電",
    "昔流行した便利グッズ",

    "有名なCMの裏話"

];


topics = topics.concat(extraTopics);


/* =========================
   現在のお題
========================= */

let currentTopic = "";


/* =========================
   振動
========================= */

function vibrate() {

    if (navigator.vibrate) {

        navigator.vibrate([
            70,
            30,
            70
        ]);

    }

}


/* =========================
   ランダムお題
========================= */

function randomTopic() {

    let newTopic;

    do {

        newTopic =
            topics[
                Math.floor(
                    Math.random() *
                    topics.length
                )
            ];

    } while (
        newTopic === currentTopic
    );

    currentTopic = newTopic;

    document.getElementById(
        "topic"
    ).textContent = currentTopic;

}


/* =========================
   Google検索
========================= */

function searchGoogle() {

    if (currentTopic === "") {

        randomTopic();

    }

    const query =
        encodeURIComponent(
            currentTopic
        );

    window.open(

        "https://www.google.com/search?q=" +
        query,

        "_blank"

    );

}


/* =========================
   検索ワードタップ
========================= */

const result =
    document.getElementById(
        "result"
    );


result.addEventListener(

    "click",

    function() {

        searchGoogle();

    }

);


/* =========================
   リロードボタン
========================= */

const reloadButton =
    document.getElementById(
        "reloadButton"
    );


reloadButton.addEventListener(

    "pointerup",

    function(e) {

        e.preventDefault();
        e.stopPropagation();

        randomTopic();

        vibrate();

    }

);


/* =========================
   長押し
========================= */

const longPressText =
    document.getElementById(
        "longPressText"
    );


let longPressTimer = null;

let repeatTimer = null;


/* =========================
   長押し開始
========================= */

function startLongPress() {

    longPressTimer = setTimeout(

        function() {

            /*
               長押し開始時に
               1回だけ振動
            */

            vibrate();


            /*
               最初のお題変更
            */

            randomTopic();


            /*
               0.15秒ごとに
               振動なしで変更
            */

            repeatTimer = setInterval(

                function() {

                    randomTopic();

                },

                150

            );

        },

        200

    );

}


/* =========================
   長押し終了
========================= */

function stopLongPress() {

    if (longPressTimer) {

        clearTimeout(
            longPressTimer
        );

        longPressTimer = null;

    }

    if (repeatTimer) {

        clearInterval(
            repeatTimer
        );

        repeatTimer = null;

    }

}


/* =========================
   長押し操作
========================= */

longPressText.addEventListener(

    "pointerdown",

    function(e) {

        e.preventDefault();

        startLongPress();

    }

);


longPressText.addEventListener(

    "pointerup",

    function(e) {

        e.preventDefault();

        stopLongPress();

    }

);


longPressText.addEventListener(

    "pointercancel",

    function() {

        stopLongPress();

    }

);

   下スワイプ
========================= */

/* スワイプ距離 */

const swipeDistance = 45;

   タッチ開始
========================= */

document.addEventListener(

    "touchstart",

    function(e) {

        if (
            e.touches.length !== 1
        ) {

            return;

        }

        touchStartX =
            e.touches[0].clientX;

        touchStartY =
            e.touches[0].clientY;

        swipeTriggered = false;

    },

    {
        passive: true
    }

);

   タッチ終了
========================= */
