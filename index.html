<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 ランダム検索</title>

<style>

body {
    background: #111;
    color: white;
    text-align: center;
    font-family: sans-serif;
    padding: 40px 10px;
    margin: 0;
}

h1 {
    font-size: 36px;
    margin-bottom: 30px;
}

#result {
    background: #222;
    border: 3px solid #555;
    border-radius: 20px;
    padding: 50px 15px;
    margin: 30px auto;
    max-width: 900px;
    box-sizing: border-box;
}

#topic {
    font-size: 30px;
    font-weight: bold;
    line-height: 1.5;
}

button {
    font-size: 22px;
    padding: 18px 28px;
    margin: 10px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
}

#reloadButton {
    background: #555;
    color: white;
}

#searchButton {
    background: #4285f4;
    color: white;
}

#swipeText {
    font-size: 18px;
    color: #aaa;
    margin-top: 35px;
}

@media screen and (max-width: 600px) {

    h1 {
        font-size: 30px;
    }

    #result {
        padding: 45px 12px;
        margin: 25px auto;
    }

    #topic {
        font-size: 26px;
    }

    button {
        font-size: 20px;
        padding: 16px 24px;
    }

    #swipeText {
        font-size: 16px;
    }

}

</style>
</head>


<body>

<h1>🎰 ランダム検索</h1>


<div id="result">

    <div id="topic">？？？</div>

</div>


<button id="reloadButton" onclick="randomTopic()">
    🔄 リロード
</button>

<br>

<button id="searchButton" onclick="searchGoogle()">
    🔎 Googleで検索
</button>


<div id="swipeText">
    ⇩ 下にスワイプしてリロード
</div>



<script>

/* =========================
   これまでのお題 300個
========================= */

const categories = [

    "身近な科学",
    "宇宙",
    "動物",
    "植物",
    "食べ物",
    "人体",
    "心理学",
    "歴史",
    "地理",
    "日本",

    "世界",
    "文化",
    "音楽",
    "映画",
    "ゲーム",
    "スポーツ",
    "サッカー",
    "テクノロジー",
    "インターネット",
    "乗り物",

    "建物",
    "仕事",
    "お金",
    "生活",
    "料理",
    "言葉",
    "雑学",
    "不思議",
    "未来",
    "ランキング"

];


const subjects = [

    "意外な事実",
    "知られざる歴史",
    "面白い仕組み",
    "驚きの違い",
    "意外な共通点",
    "世界の珍しい例",
    "昔と今の違い",
    "最も○○なもの",
    "身近だけど知らないこと",
    "検索すると面白いもの"

];


let topics = [];


for (let i = 0; i < categories.length; i++) {

    for (let j = 0; j < subjects.length; j++) {

        topics.push(
            categories[i] + "の" + subjects[j]
        );

    }

}


/* =========================
   新しいお題 50個
========================= */

const extraTopics = [

    "コンビニの面白い商品",
    "コンビニ商品の意外な開発秘話",
    "スーパーで売っている珍しい商品",
    "世界の変わったお菓子",
    "日本のご当地お菓子",
    "世界の変わった飲み物",
    "珍しいアイスクリーム",
    "変わったインスタント食品",
    "世界の変わったパン",
    "意外な組み合わせの食べ物",

    "世界の変わったホテル",
    "泊まってみたい珍しいホテル",
    "世界の面白い観光地",
    "一度は見てみたい珍しい場所",
    "世界の変わった遊園地",
    "珍しいテーマパーク",
    "世界の面白い駅",
    "変わった形の駅",
    "世界の珍しい空港",
    "飛行機の意外な仕組み",

    "企業ロゴの意外な意味",
    "有名ブランドの名前の由来",
    "商品の名前の由来",
    "有名商品の誕生秘話",
    "ロングセラー商品の秘密",
    "昔の家電と現在の家電の違い",
    "昔の携帯電話の面白い機能",
    "意外と高価な家電",
    "変わった形の家電",
    "昔流行した便利グッズ",

    "世界の珍しいファッション",
    "昔のファッションの流行",
    "服の意外な名前の由来",
    "靴の意外な歴史",
    "帽子の面白い歴史",
    "珍しい文房具",
    "文房具の意外な発明",
    "世界の変わった筆記具",
    "変わった家具",
    "面白いインテリア",

    "世界の珍しい美術館",
    "変わった美術作品",
    "有名な絵画の意外な話",
    "有名な彫刻の秘密",
    "世界の変わった建築デザイン",
    "一度見たら忘れない建物",
    "世界の奇妙な形の建物",
    "面白い広告の歴史",
    "有名なCMの裏話",
    "SNSで生まれた流行の由来"

];


/* =========================
   50個を追加
========================= */

topics = topics.concat(extraTopics);


/* =========================
   現在のお題
========================= */

let currentTopic = "";


/* =========================
   ランダム検索
========================= */

function randomTopic() {

    let newTopic;


    do {

        newTopic =
            topics[
                Math.floor(
                    Math.random() * topics.length
                )
            ];

    } while (
        newTopic === currentTopic &&
        topics.length > 1
    );


    currentTopic = newTopic;


    document.getElementById("topic").textContent =
        currentTopic;

}


/* =========================
   Google検索
========================= */

function searchGoogle() {

    if (currentTopic === "") {

        randomTopic();

    }


    const query =
        encodeURIComponent(currentTopic);


    window.open(
        "https://www.google.com/search?q=" + query,
        "_blank"
    );

}


/* =========================
   ページを開いたとき
   自動でランダム表示
========================= */

randomTopic();

</script>

</body>
</html>>
